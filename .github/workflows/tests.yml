name: Tests

on:
  push:
    branches: [main]
    paths: ['js/**', 'tests/**', 'data/**', '.github/workflows/tests.yml']
  pull_request:
    paths: ['js/**', 'tests/**', 'data/**', '.github/workflows/tests.yml']

permissions:
  contents: read

jobs:
  cercania:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
