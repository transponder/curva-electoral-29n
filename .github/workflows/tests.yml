name: Tests

on:
  push:
    branches: [main]
    paths: ['js/**', 'css/**', 'index.html', 'tests/**', 'data/**', 'scripts/versionar.py', 'scripts/generar_paginas.js', 'metodologia/**', 'aviso-legal/**', 'privacidad/**', 'quienes-somos/**', 'partido/**', 'sitemap.xml', '.github/workflows/tests.yml']
  pull_request:
    paths: ['js/**', 'css/**', 'index.html', 'tests/**', 'data/**', 'scripts/versionar.py', 'scripts/generar_paginas.js', 'metodologia/**', 'aviso-legal/**', 'privacidad/**', 'quienes-somos/**', 'partido/**', 'sitemap.xml', '.github/workflows/tests.yml']

permissions:
  contents: read

jobs:
  cercania:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
      - name: Versiones de CSS y JS en index.html
        run: python3 scripts/versionar.py --comprobar
      - name: Páginas estáticas y sitemap al día con data/
        run: node scripts/generar_paginas.js --comprobar
