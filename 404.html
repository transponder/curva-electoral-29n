<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página no encontrada · Kurba</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F2F3F0;color:#14161B;font:16px/1.5 system-ui,sans-serif;padding:20px}
    @media (prefers-color-scheme:dark){body{background:#121315;color:#ECEDEA}}
    main{max-width:420px;display:flex;flex-direction:column;gap:12px}
    a{display:inline-flex;align-items:center;justify-content:center;height:52px;border-radius:16px;background:#FFC533;color:#14161B;font-weight:700;text-decoration:none}
  </style>
</head>
<body>
<main>
  <h1>Página no encontrada</h1>
  <p>Esta dirección no existe. Te llevamos al inicio de Kurba.</p>
  <a id="inicio" href="/">Ir al inicio</a>
</main>
<script>
  /* Con dominio propio la web está en la raíz; en github.io, en /curva-electoral-29n/. */
  var base = /\.github\.io$/.test(location.hostname) ? '/curva-electoral-29n/' : '/';
  document.getElementById('inicio').href = base + '#/';
  location.replace(base + '#/');
</script>
</body>
</html>
